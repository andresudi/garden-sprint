<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bunbun Carrot Dash</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='44'%3EB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-label="Bunbun Carrot Dash game">
      <canvas id="game" width="960" height="540" aria-label="Bunbun Carrot Dash canvas"></canvas>
      <section id="menu" class="overlay" aria-live="polite">
        <div class="brand">Bunbun Carrot Dash</div>
        <div id="menu-copy" class="menu-copy">Hop through the garden and scoop up every carrot you can reach.</div>
        <div class="control-row" aria-label="Controls">
          <span>Space</span>
          <span>Tap</span>
          <span>F</span>
        </div>
        <button id="start-btn" type="button">Start Run</button>
        <button id="restart-btn" type="button" hidden>Restart</button>
      </section>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
